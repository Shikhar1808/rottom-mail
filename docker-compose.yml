# Local infra. Ports are bound to 127.0.0.1 so nothing is reachable from the network.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rottom
      POSTGRES_PASSWORD: rottom
      POSTGRES_DB: rottom
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rottom"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    # AOF so delayed jobs survive restarts; noeviction because BullMQ must never lose keys.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6380:6379"]   # 6380 on the host: avoids clashing with a locally installed Redis
    volumes: ["redis-data:/data"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]

volumes:
  pg-data:
  redis-data:
  es-data:
